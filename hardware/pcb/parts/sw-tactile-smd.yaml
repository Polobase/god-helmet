# Tactile switch, SMD, 5.1 x 5.1 mm, 4 terminals (two pairs joined inside), SPST-NO: XKB TS-1187A-B-A-B
# (160 gf, 1.5 mm high, brass keystake). For the on-board STOP button.
# Datasheet: XKB drawing TS-1187A-X-X-X, revision A0, sheet 1/1 (LCSC copy for C318884), read 2026-11-12 by
#   rendering the page: schematic A-B joined, C-D joined, the contact between the pairs (A top left, B top
#   right, C bottom left, D bottom right); "P.C.B layout, top view": four pads, 7.0 over the outer and 5.0 over
#   the inner edges (1.0 wide, centres +-3.0), 4.5 over the outer and 3.0 over the inner edges (0.75 high,
#   centres +-1.875); 50 mA 12 V DC, travel 0.25 mm; ordering code TS-1187A-[force]-[height]-[keystake]:
#   B = 160 gf, A = 1.5 mm, B = brass.
# KiCad 10.0.6 footprint SW_Push_1P1T_XKB_TS-1187A (read 2026-11-12): pads 1.0 x 0.75 at (+-3.0, -1.875)
#   both numbered 1 and at (+-3.0, +1.875) both numbered 2: equal to XKB's layout, the joined pairs A-B and
#   C-D each carry one number. So the 2-pin symbol fits.
# Symbol Switch:SW_Push: pins 1 and 2; footprint numbered pads {1, 2}: equal, checked 2026-11-12. (SW_Push_Dual,
#   4 pins, does not fit this footprint.)
# JLCPCB parts API, read 2026-11-13: C318884, Basic, SMT, stock 827,385, USD 0.0215 at 1+.
#   Basic alternative: XUNPU TS-1088-AR02016, 3.9 x 3 mm, two terminals, C720477 (stock 930,515, USD 0.0516),
#   with KiCad's Button_Switch_SMD:SW_SPST_TS-1088-xR020 (2 pads, made from that part's LCSC datasheet); not
#   checked against its datasheet here.
# CPL: JLCPCB's footprint (EasyEDA/JLCEDA official library, https://easyeda.com; package
#   SW-SMD_4P-L5.1-W5.1-P3.70-LS6.5-TL_H1.5, read 2026-11-12): pads A, B on top and C, D below at (+-3.0, +-1.85),
#   turned by 0 degrees on KiCad's (A, B on pad 1): no cplRotation. The switch is symmetric; 180 degrees would
#   also be right.

# Texas Instruments OPA4197IDR: quad 36 V precision op-amp, rail-to-rail input and output, SOIC-14. Replaces the
# TL074H on helmet-driver (stage 1 of the coil channels and the tES island), coordinator's note 2026-11-12.
# Datasheet: TI SBOS737C (OPA197, OPA2197, OPA4197; January 2016, revised March 2018), read 2026-11-12:
#   Pin configuration p. 3 and pin functions p. 4, OPA4197 D (SOIC): 1 OUT A, 2 -IN A, 3 +IN A, 4 V+, 5 +IN B,
#   6 -IN B, 7 OUT B, 8 OUT C, 9 -IN C, 10 +IN C, 11 V-, 12 +IN D, 13 -IN D, 14 OUT D.
#   KiCad's Amplifier_Operational:OPA4197xD has five units: A (1 out, 2 -, 3 +), B (5 +, 6 -, 7 out), C (8 out,
#   9 -, 10 +), D (12 +, 13 -, 14 out) and the power unit E (4 V+, 11 V-): each unit's pins belong to one TI channel,
#   checked pin by pin 2026-11-12. With Package_SO:SOIC-14_3.9x8.7mm_P1.27mm pads 1-14: match. Place all five units.
#   Absolute maximum p. 5: supply +-20 V (40 V single); inputs (V-) - 0.5 to (V+) + 0.5 V, 10 mA; output short
#   circuit continuous for one amplifier per package. ESD CDM +-500 V for the OPA4197 (p. 5).
#   p. 6: RthJA 86.4 C/W (SOIC-14). p. 8: quiescent current 1 mA typ, 1.3 mA max per amplifier; short-circuit current
#   +-65 mA at +-18 V.
# JLCPCB parts API, read 2026-11-12: C2058532, Texas Instruments OPA4197IDR, Extended, SMT, stock 6,055,
# USD 3.1879 (1+), 2.4551 (30+).

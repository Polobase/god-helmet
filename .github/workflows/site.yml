name: Site

# Tests the Nuxt site in site/ (landing page, articles, docs and the control
# app). Publishing is not done here: Cloudflare Pages is connected to this
# repository and builds site/ itself on every push (root directory site,
# command "npm run build", output .output/public). Pushes to main go to
# production, other branches get a preview address.
#
# Cloudflare's builder cannot build the firmware, so the installer on the
# Helmet tab takes its images from where NUXT_PUBLIC_FIRMWARE_BASE points
# (set in the Pages project): the copies the Pages workflow publishes.

on:
  push:
    branches: [main]
    paths: ["site/**", "presets/**", "guides/**", "docs/**", "README.md", "hardware/BOM.md",
            "firmware/lib/engine/**", "firmware/test/fixtures/**", ".github/workflows/site.yml"]
  pull_request:
    paths: ["site/**", "presets/**", "guides/**", "docs/**", "README.md", "hardware/BOM.md",
            "firmware/lib/engine/**", "firmware/test/fixtures/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install
        working-directory: site
        run: npm ci
      # The unit tests include the shared core in site/core: engine parity with
      # the firmware, protocol, connection, guides and every program file.
      - name: Lint, types and unit tests
        working-directory: site
        run: npm run lint && npm run typecheck && npm test
      - name: Program files and the command-line tools under plain Node
        working-directory: site
        run: npm run check-presets && node scripts/table.mjs list > /dev/null
      - name: Build the static site
        working-directory: site
        run: npm run build
      - name: End-to-end tests against the built site (Demo mode, headless)
        working-directory: site
        run: npx playwright install --with-deps chromium && npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: site/playwright-report
          if-no-files-found: ignore

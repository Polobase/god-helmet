name: Site

# Tests the Nuxt site in site/ (landing page, articles, docs and the control
# app). Publishing is not done here: Cloudflare Pages is connected to this
# repository and builds site/ itself on every push (root directory site,
# command "npm run build", output .output/public). Pushes to main go to
# production, other branches get a preview address.
#
# Cloudflare's builder cannot build the firmware, so the installer on the
# Helmet tab takes its images from where NUXT_PUBLIC_FIRMWARE_BASE points
# (set in the Pages project): the copies the Pages workflow publishes.

on:
  push:
    branches: [main]
    paths: ["site/**", "webapp/src/**", "webapp/test/**", "presets/**", "guides/**", "docs/**", "README.md", "hardware/BOM.md",
            ".github/workflows/site.yml"]
  pull_request:
    paths: ["site/**", "webapp/src/**", "webapp/test/**", "presets/**", "guides/**", "docs/**", "README.md", "hardware/BOM.md",
            ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            webapp/package-lock.json
      # The engine, audio, protocol and lib modules are shared from webapp/src
      # until cut-over; their tests gate this site too.
      - name: Core tests (engine parity with the firmware, protocol, connection, guides)
        working-directory: webapp
        run: npm ci && npm test
      - name: Install
        working-directory: site
        run: npm ci
      - name: Lint, types and unit tests
        working-directory: site
        run: npm run lint && npm run typecheck && npm test
      - name: Build the static site
        working-directory: site
        run: npm run build
      - name: End-to-end tests against the built site (Demo mode, headless)
        working-directory: site
        run: npx playwright install --with-deps chromium && npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: site/playwright-report
          if-no-files-found: ignore

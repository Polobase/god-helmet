name: Firmware images → GitHub Pages

# The control app and the docs are the Nuxt site in site/, published by
# Cloudflare Pages. Cloudflare's builder cannot build firmware, so this
# workflow builds the images for the site's installer (Helmet tab) and
# publishes them at <pages address>/firmware/, where the site's
# NUXT_PUBLIC_FIRMWARE_BASE points.
#
# The address used to serve the previous app. Its start page now forwards to
# the site when the repository variable SITE_URL is set (Settings → Secrets
# and variables → Actions → Variables), and shows a short notice otherwise.

on:
  push:
    branches: [main]
    paths: ["firmware/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      - name: Build every board and merge the images
        run: ./firmware/scripts/web_bundle.sh pages/firmware
      - name: Start page (forwards to the site, keeping an old #link)
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          cat > pages/index.html <<EOF
          <!doctype html>
          <html lang="en">
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>God Helmet</title>
          <script>
            var site = "${SITE_URL%/}";
            if (site) location.replace(site + "/" + location.hash);
          </script>
          <body style="font: 16px/1.5 system-ui, sans-serif; max-width: 34rem; margin: 15vh auto; padding: 0 1rem">
          <h1>The app has moved</h1>
          <p>This address now only holds the firmware images for the installer. The control app and the documentation are in the
          <a href="https://github.com/${{ github.repository }}">repository</a> (folder <code>site/</code>).</p>
          </body>
          </html>
          EOF
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    needs: firmware
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: Firmware

on:
  push:
    paths: ["firmware/**", "presets/**", ".github/workflows/firmware.yml"]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Host unit tests (engine, JSON, BLE framing, presets)
        run: ./firmware/test/run_host_tests.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install platformio
      - name: Build ESP32-S3 and ESP32
        working-directory: firmware
        run: pio run -e esp32s3 -e esp32dev

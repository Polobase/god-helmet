name: Firmware

on:
  push:
    paths: ["firmware/**", "presets/**", "webapp/src/lib/**", "webapp/src/engine/**", "webapp/scripts/sd-pack.mjs",
            ".github/workflows/firmware.yml"]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Host unit tests (engine, JSON, BLE framing, presets)
        run: ./firmware/test/run_host_tests.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install platformio
      - name: Build ESP32-S3, ESP32, ESP32-C3, ESP32-C6 and the 2.8" display board
        working-directory: firmware
        run: pio run -e esp32s3 -e esp32dev -e esp32c3 -e esp32c6 -e esp32e_lcd28
      - name: Merge the images for the web installer
        run: ./firmware/scripts/web_bundle.sh firmware/.pio/web --no-build
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Touchscreen UI on the host (every screen, SD pack from the presets)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libsdl2-dev
          (cd webapp && npm ci)
          ./firmware/test/uisim/run.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: firmware/.pio/uisim/shots

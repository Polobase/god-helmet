; 8-coil weak-field helmet controller: ESP32-S3 (or ESP32) + AD5328 (±10 V module),
; controlled over BLE by the web app in ../webapp.
;
; Only libraries bundled with Arduino-ESP32 are used (BLE, LittleFS,
; Preferences, mbedtls); JSON lives in lib/minijson, BLE framing in
; lib/bleframe. Portable code (lib/*) is unit-tested on the host:
;   ./test/run_host_tests.sh

[platformio]
default_envs = esp32s3

[common]
; pioarduino build of the Espressif platform -> Arduino-ESP32 core 3.0.x (ESP-IDF 5.1)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.03/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
build_flags = -DCORE_DEBUG_LEVEL=1
build_unflags = -std=gnu++11
build_src_flags = -std=gnu++17 -Wall

; ESP32-S3-DevKitC-1 N8R8 / N16R8 (8 MB layout also works on 16 MB boards)
[env:esp32s3]
extends = common
board = esp32-s3-devkitc-1
board_build.flash_size = 8MB
board_build.partitions = default_8MB.csv

; Classic ESP32 DevKitC (WROOM-32, 4 MB): 3 MB app, ~1 MB LittleFS
[env:esp32dev]
extends = common
board = esp32dev
board_build.partitions = huge_app.csv

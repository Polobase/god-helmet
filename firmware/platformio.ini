; 8-coil weak-field helmet controller: ESP32-S3, ESP32, ESP32-C3 or ESP32-C6 +
; AD5328 (±10 V module), controlled by the web app in ../webapp over Bluetooth
; or USB. Pins per chip: src/config.h and docs/WIRING.md.
;
; Only libraries bundled with Arduino-ESP32 are used (BLE, LittleFS,
; Preferences, mbedtls); JSON lives in lib/minijson, BLE framing in
; lib/bleframe. Portable code (lib/*) is unit-tested on the host:
;   ./test/run_host_tests.sh

[platformio]
default_envs = esp32s3

[common]
; pioarduino build of the Espressif platform -> Arduino-ESP32 core 3.0.x (ESP-IDF 5.1)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.03/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
build_flags = -DCORE_DEBUG_LEVEL=1
build_unflags = -std=gnu++11
build_src_flags = -std=gnu++17 -Wall
; The touchscreen UI (src/ui) is built only for the display board.
build_src_filter = +<*> -<ui/>

; Chips with their own USB (S3, C3, C6): Serial is that USB socket, Serial0
; the UART behind the board's USB bridge chip; src/usblink.cpp serves both.
[usb_native]
build_flags = ${common.build_flags} -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

; ESP32-S3-DevKitC-1 N8R8 / N16R8 (8 MB layout also works on 16 MB boards)
[env:esp32s3]
extends = common
board = esp32-s3-devkitc-1
board_build.flash_size = 8MB
board_build.partitions = default_8MB.csv
build_flags = ${usb_native.build_flags}

; Classic ESP32 DevKitC (WROOM-32, 4 MB): 3 MB app, ~1 MB LittleFS
[env:esp32dev]
extends = common
board = esp32dev
board_build.partitions = huge_app.csv

; ESP32-C3-DevKitM-1 or a C3 Super Mini (4 MB, single core)
[env:esp32c3]
extends = common
board = esp32-c3-devkitm-1
board_build.partitions = huge_app.csv
build_flags = ${usb_native.build_flags}

; ESP32-C6-DevKitC-1 or other C6 boards (4 MB layout, also on 8 MB boards; single core)
[env:esp32c6]
extends = common
board = esp32-c6-devkitc-1
board_build.flash_size = 4MB
board_build.partitions = huge_app.csv
build_flags = ${usb_native.build_flags}

; "2.8inch ESP32-32E Display" (LCDwiki E32R28T / E32N28T, 4 MB), standalone:
; touchscreen UI, programs on the microSD card, AD5328 on the board's SPI
; peripheral header (docs/STANDALONE.md, docs/WIRING.md).
[env:esp32e_lcd28]
extends = common
board = esp32dev
board_build.partitions = huge_app.csv
build_flags = ${common.build_flags} -DBOARD_ESP32E_LCD28 -DSTANDALONE_UI
extra_scripts = pre:scripts/lgfx_ets_printf.py
build_src_filter = +<*>
; 1.1.16: Arduino-ESP32 3.0 support (LEDC) and the bit-banged XPT2046 touch
; driver; the touch chip must stay off VSPI, which the DAC and SD card use.
lib_deps = lovyan03/LovyanGFX@1.1.16
; Opening the serial monitor must not pulse EN/IO0 through the CH340 auto-reset.
monitor_dtr = 0
monitor_rts = 0
